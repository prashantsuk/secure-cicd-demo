# Place at: .github/workflows/supply-chain-pipeline.yml
#
# Software supply chain demo:
#   secrets -> SAST -> dependencies -> IaC -> policy  (all in parallel, on every PR)
#   then: build -> scan image -> push -> SBOM -> sign -> provenance -> verify  (main only)
#   optional: keyless login to GCP via Workload Identity Federation
#
# Runs on a free GitHub account. Images go to ghcr.io using the built-in GITHUB_TOKEN.
#
# HARDENING NOTE: actions below use version tags for readability. In real use, pin each
# third-party action to a full commit SHA (Dependabot can keep the SHAs updated).

name: supply-chain-pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # default for every job; jobs that need more ask for it explicitly

jobs:
  # ---------- 1. Secrets detection ----------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Code scanning (SAST) ----------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # owasp_examples.py and terraform/insecure are intentionally vulnerable (training files).
      # Remove those --exclude lines to watch this gate fail.
      #
      # TEMPORARY: the mutable-action-tag rule is skipped so the rest of the pipeline can run.
      # TODO: pin every `uses:` to a full commit SHA, then delete the --exclude-rule line.
      - name: Semgrep (OWASP Top 10 rules)
        run: |
          semgrep scan --config p/owasp-top-ten --error \
            --exclude app/owasp_examples.py \
            --exclude terraform/insecure \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  # ---------- 3. Dependency scanning (SCA) ----------
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- 4. IaC scanning ----------
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov on the secure Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/secure
          framework: terraform
          # First run may report findings in secure.tf. That is part of the exercise:
          # fix them, or set soft_fail: true temporarily while you learn.
          soft_fail: false

  # ---------- 5. Policy as code (OPA via Conftest) ----------
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tests the .tf files directly, so no cloud credentials are needed.
      - name: Conftest on Terraform source
        run: |
          docker run --rm -v "$PWD":/project openpolicyagent/conftest \
            test terraform/secure --parser hcl2 --policy policy

  # ---------- 6. Build, scan, push, SBOM, sign, provenance, verify ----------
  build-and-sign:
    needs: [secrets-scan, sast, dependency-scan, iac-scan, policy-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing (OIDC)
      attestations: write # GitHub build provenance
    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ----- everything below runs only on pushes to main -----
      - name: Log in to GitHub Container Registry
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # we attach our own signed provenance below
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install cosign
        if: env.IS_RELEASE == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: env.IS_RELEASE == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM (SPDX)
        if: env.IS_RELEASE == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to the image as a signed attestation
        if: env.IS_RELEASE == 'true'
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Build provenance (who built what, from which commit)
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature and SBOM attestation
        if: env.IS_RELEASE == 'true'
        run: |
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/"
          ISSUER="https://token.actions.githubusercontent.com"
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"
          cosign verify "$REF" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null

      - name: Re-scan the SBOM for known vulnerabilities (informational)
        if: env.IS_RELEASE == 'true'
        uses: anchore/scan-action@v6
        with:
          sbom: sbom.spdx.json
          fail-build: false

      - name: Summary
        if: env.IS_RELEASE == 'true'
        run: |
          {
            echo "### Release artifact"
            echo "- Image: \`${IMAGE}@${{ steps.push.outputs.digest }}\`"
            echo "- Signed with cosign (keyless), SBOM attached, provenance attested"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 7. Optional: keyless login to GCP ----------
  gcp-keyless-check:
    needs: build-and-sign
    # Runs only if you set repository variables GCP_WIF_PROVIDER and GCP_SERVICE_ACCOUNT
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Prove we are authenticated without any stored key
        run: gcloud auth list
