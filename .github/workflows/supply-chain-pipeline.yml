
# Place at: .github/workflows/supply-chain-pipeline.yml
#
# Software supply chain demo:
#   secrets -> SAST -> dependencies -> IaC -> policy (parallel on every PR/push)
#   then: build -> scan image -> push -> SBOM -> sign -> provenance -> verify
#   GCP Workload Identity Federation authentication from main and Feature/101
#
# Images go to ghcr.io using the built-in GITHUB_TOKEN.
#
# HARDENING NOTE:
# Pin third-party actions to full commit SHAs in production.
# Dependabot can help keep the SHAs updated.

name: supply-chain-pipeline

on:
  pull_request:
  push:
    branches:
      - main
      - Feature/101
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ---------- 1. Secrets detection ----------
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 2. Code scanning (SAST) ----------
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Training files intentionally contain vulnerable examples.
      - name: Semgrep (OWASP Top 10 rules)
        run: |
          semgrep scan --config p/owasp-top-ten --error \
            --exclude app/owasp_examples.py \
            --exclude terraform/insecure \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  # ---------- 3. Dependency scanning (SCA) ----------
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- 4. IaC scanning ----------
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov on secure Terraform
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/secure
          framework: terraform
          soft_fail: false

  # ---------- 5. Policy as Code (OPA via Conftest) ----------
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conftest on Terraform source
        run: |
          docker run --rm -v "$PWD":/project openpolicyagent/conftest \
            test terraform/secure --parser hcl2 --policy policy

  # ---------- 6. Build, scan, push, SBOM, sign, provenance, verify ----------
  build-and-sign:
    needs:
      - secrets-scan
      - sast
      - dependency-scan
      - iac-scan
      - policy-check

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IS_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally for scanning on both branches.
      - name: Build image (local only, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # ----- Release operations: main branch only -----

      - name: Log in to GitHub Container Registry
        if: env.IS_RELEASE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: env.IS_RELEASE == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install cosign
        if: env.IS_RELEASE == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: env.IS_RELEASE == 'true'
        run: |
          cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Generate SBOM (SPDX)
        if: env.IS_RELEASE == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image as signed attestation
        if: env.IS_RELEASE == 'true'
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json \
            "${IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Build provenance
        if: env.IS_RELEASE == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify signature and SBOM attestation
        if: env.IS_RELEASE == 'true'
        run: |
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY}/"
          ISSUER="https://token.actions.githubusercontent.com"
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"

          cosign verify "$REF" \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"

          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER" > /dev/null

      - name: Re-scan SBOM for known vulnerabilities
        if: env.IS_RELEASE == 'true'
        uses: anchore/scan-action@v6
        with:
          sbom: sbom.spdx.json
          fail-build: false

      - name: Summary
        if: env.IS_RELEASE == 'true'
        run: |
          {
            echo "### Release artifact"
            echo "- Image: \`${IMAGE}@${{ steps.push.outputs.digest }}\`"
            echo "- Signed with cosign (keyless)"
            echo "- SBOM attached"
            echo "- Provenance attested"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 7. GCP Workload Identity Federation ----------
  # Authentication is permitted from main and Feature/101.
  # Terraform provider must allow both branches in its attribute_condition.

  gcp-keyless-check:
    needs: build-and-sign

    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/Feature/101') &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP authentication
        run: |
          echo "Successfully authenticated to Google Cloud using WIF"
          gcloud auth list
